[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airpods-sync"
dynamic = ["version"]
description = "Educational project to bring AirPods auto-switching closer to Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["bleak==0.22.3", "pycaw==20260927", "pystray==0.19.5", "Pillow==13.0.0",
    "winrt-Windows.Media.Control==2.3.0",
    "customtkinter==5.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller==6.16.0"]

[project.scripts]
airpods-sync = "airpods_sync.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "airpods_sync.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
